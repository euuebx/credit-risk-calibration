[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-calibration"
version = "1.0.0"
description = "Real-data credit default prediction and probability calibration"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3",
  "matplotlib>=3.7", "requests>=2.31", "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
